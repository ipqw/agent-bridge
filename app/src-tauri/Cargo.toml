[package]
name = "agent-bridge"
version = "0.3.0"
description = "Agent Bridge: local hands for the remote agent"
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "=2.7.1", features = [] }

[dependencies]
tauri = { version = "=2.12.1", features = ["tray-icon"] }
tauri-plugin-single-instance = "=2.5.1"
tauri-plugin-notification = "=2.5.0"
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
